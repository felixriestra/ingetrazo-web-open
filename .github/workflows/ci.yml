# Run the test suite on every pull request and on every push to main.
#
# Ubuntu, Python 3.12, the "not slow" marker. The tests that need Qt run
# with QT_QPA_PLATFORM=offscreen, so no display is required.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:        # manual runs from the Actions tab

# A force-push to a PR branch cancels the now-obsolete run instead of
# queueing behind it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read            # tests only ever read the checkout

jobs:
  tests:
    name: pytest (not slow)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System packages
        # What PySide6 needs to load without a display on a bare runner.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0

      - name: Python dependencies
        # The same two files the README installs from.
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r requirements.txt -r web/backend/requirements.txt
          python -c "import PySide6, numpy, openskp, fastapi; print('deps OK')"

      - name: Engine modules the service may reach
        run: python -m web.tools.reachability --check

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -m "not slow"
